<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Key Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #000; color: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); }
  input:focus { outline: none; border-color: rgba(255, 255, 255, 0.3); }
  .btn-white { background: #fff; color: #000; transition: all 0.2s; }
  .btn-white:hover { background: #e5e5e5; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-md space-y-8">
  
  <!-- 密码保护层 -->
  <div id="lockScreen" class="glass rounded-3xl p-8 space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-xl font-bold italic tracking-tighter">ACCESS_LOCKED</h1>
      <p class="text-xs text-white/40 uppercase tracking-widest">Enter Admin Password</p>
    </div>
    <div class="space-y-4">
      <input id="adminPass" type="password" placeholder="••••••••" 
        class="w-full bg-white/[0.05] border border-white/10 rounded-xl px-4 py-3 text-center text-lg tracking-[0.5em]">
      <button onclick="checkPass()" class="w-full btn-white py-3 rounded-xl font-bold uppercase text-sm">Unlock</button>
    </div>
  </div>

  <!-- 生成器界面 (默认隐藏) -->
  <div id="genScreen" class="hidden glass rounded-3xl p-8 space-y-8">
    <div class="flex justify-between items-center border-b border-white/10 pb-4">
      <h2 class="text-lg font-bold italic tracking-tighter text-emerald-400">KEY_GENERATOR</h2>
      <button onclick="location.reload()" class="text-[10px] text-white/40 hover:text-white">LOCK</button>
    </div>

    <div class="space-y-6">
      <div class="space-y-2">
        <label class="text-[10px] text-white/40 uppercase tracking-widest">Prefix (4 Chars)</label>
        <div class="flex gap-2">
          <input id="prefixInput" type="text" maxlength="4" placeholder="A1B2" 
            class="flex-1 bg-white/[0.05] border border-white/10 rounded-xl px-4 py-3 font-mono uppercase">
          <button onclick="randomPrefix()" class="glass px-3 rounded-xl text-xs hover:bg-white/5">RAND</button>
        </div>
      </div>

      <button onclick="doGenerate()" class="w-full btn-white py-4 rounded-xl font-bold uppercase text-sm tracking-widest">Generate New Key</button>

      <div id="resultArea" class="hidden space-y-2 pt-4 border-t border-white/10">
        <span class="text-[10px] text-white/40 uppercase tracking-widest">Generated Key</span>
        <div class="relative group">
          <input id="finalKey" readonly 
            class="w-full bg-black border border-emerald-500/30 rounded-xl px-4 py-4 text-emerald-400 font-mono text-center">
          <button onclick="copyKey()" class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] glass px-3 py-1 rounded-lg hover:bg-white/10">COPY</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 全局提示 -->
<div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 bg-white text-black text-xs px-6 py-3 rounded-full font-bold opacity-0 transition-all duration-300 pointer-events-none z-50"></div>

<script>
const SALT = 'MY_SECRET_2026'; // 必须与 index.html 一致
const PASS = 'Tx882239';

const $ = (s) => document.querySelector(s);

function checkPass() {
  if ($('#adminPass').value === PASS) {
    $('#lockScreen').classList.add('hidden');
    $('#genScreen').classList.remove('hidden');
  } else {
    showToast('ACCESS_DENIED');
    $('#adminPass').value = '';
  }
}

function randomPrefix() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let res = '';
  for(let i=0; i<4; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
  $('#prefixInput').value = res;
}

async function getChecksum(input) {
  const msgUint8 = new TextEncoder().encode(input.toUpperCase() + SALT);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 4).toUpperCase();
}

async function doGenerate() {
  const prefix = $('#prefixInput').value.trim().toUpperCase();
  if (prefix.length !== 4) {
    showToast('PREFIX_LENGTH_ERROR');
    return;
  }
  const cs = await getChecksum(prefix);
  $('#finalKey').value = `GOOUT-${prefix}-${cs}`;
  $('#resultArea').classList.remove('hidden');
}

function copyKey() {
  navigator.clipboard.writeText($('#finalKey').value);
  showToast('COPIED');
}

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2000);
}

// 监听回车
$('#adminPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPass(); });
</script>
</body>
</html>
